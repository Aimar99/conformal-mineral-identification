[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-mineral-identification"
version = "0.1.0"
description = "Mineral identification from Raman spectra with conformal prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter>=1",
    "ipykernel>=6",
    "matplotlib>=3.8",
]
neural = [
    "tensorflow>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]
